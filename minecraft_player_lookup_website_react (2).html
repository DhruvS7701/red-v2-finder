<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RED V2 FINDER Minecraft Lookup</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:red;
filter:blur(180px);
opacity:.15;
left:-150px;
top:-150px;
z-index:-1;
}

.container{
min-height:100vh;
width:100%;
}





.logo{
font-size:60px;
font-weight:800;
letter-spacing:10px;
margin-bottom:10px;
}

.logo span{
color:#ff2a2a;
}

.subtitle{
color:#94a3b8;
line-height:1.7;
margin-bottom:35px;
}

.searchBox{
display:flex;
background:#111827;
border:1px solid rgba(255,255,255,.05);
border-radius:18px;
overflow:hidden;
margin-bottom:30px;
}

.searchBox input{
flex:1;
background:transparent;
border:none;
outline:none;
padding:18px;
color:white;
font-size:16px;
}

.searchBox button{
width:70px;
border:none;
background:linear-gradient(135deg,#ff1f1f,#ff4747);
color:white;
font-size:22px;
cursor:pointer;
}

.menu{
display:flex;
flex-direction:column;
gap:14px;
margin-top:20px;
}

.menuItem{
padding:18px;
border-radius:16px;
background:#0f172a;
color:#cbd5e1;
transition:.2s;
}

.menuItem.active,
.menuItem:hover{
background:linear-gradient(135deg,#ff1f1f,#ff4747);
color:white;
}

.main{
flex:1;
padding:30px;
}

.topCard{
background:rgba(17,24,39,.7);
border:1px solid rgba(255,255,255,.05);
border-radius:28px;
padding:30px;
display:flex;
align-items:center;
gap:25px;
margin-bottom:25px;
backdrop-filter:blur(15px);
box-shadow:0 0 30px rgba(255,0,0,.08);
}

.avatar{
width:120px;
height:120px;
image-rendering:pixelated;
}

.playerName{
font-size:52px;
font-weight:800;
margin-bottom:10px;
}

.badge{
display:inline-block;
padding:10px 18px;
background:#ff2a2a;
border-radius:12px;
font-size:14px;
font-weight:600;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
}

.card{
background:rgba(17,24,39,.7);
border:1px solid rgba(255,255,255,.05);
border-radius:28px;
padding:25px;
backdrop-filter:blur(15px);
box-shadow:0 0 25px rgba(255,0,0,.05);
}

.cardTitle{
font-size:14px;
font-weight:800;
letter-spacing:2px;
color:#ff3131;
margin-bottom:25px;
}

.skinPreview{
width:240px;
display:block;
margin:auto;
image-rendering:pixelated;
}

.infoBox{
background:#0f172a;
border:1px solid rgba(255,255,255,.05);
padding:15px;
border-radius:16px;
margin-bottom:15px;
}

.infoTitle{
font-size:13px;
color:#94a3b8;
margin-bottom:8px;
}

.infoValue{
word-break:break-all;
font-size:14px;
}

.historyItem{
padding:16px;
border-bottom:1px solid rgba(255,255,255,.05);
display:flex;
justify-content:space-between;
align-items:center;
}

.historyItem:last-child{
border:none;
}

pre{
background:#020617;
padding:20px;
border-radius:18px;
overflow:auto;
font-size:13px;
color:#4ade80;
}

.error{
background:rgba(255,0,0,.1);
border:1px solid rgba(255,0,0,.2);
padding:18px;
border-radius:16px;
margin-bottom:20px;
color:#ff6b6b;
}

.hidden{
display:none;
}

.loaderWrap{
display:flex;
justify-content:center;
align-items:center;
height:300px;
width:100%;
text-align:center;
}

.loaderContent{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.loader{
width:90px;
height:90px;
border:6px solid rgba(255,255,255,.08);
border-top:6px solid #ff3131;
border-radius:50%;
animation:spin 1s linear infinite;
box-shadow:0 0 30px rgba(255,49,49,.35);
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

.loadingText{
text-align:center;
margin-top:25px;
font-size:18px;
font-weight:700;
color:#ff3131;
letter-spacing:2px;
}

@media(max-width:900px){
.playerName{
font-size:36px;
}

.topCard{
flex-direction:column;
text-align:center;
}
}

.sidebar{
width:100%;
}

.playerName{
font-size:36px;
}

.topCard{
flex-direction:column;
text-align:center;
}
}
</style>
</head>
<body>

<div class="container">

<div class="main">
<div id="welcomeScreen" style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:80vh;text-align:center;">

<div style="font-size:82px;font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,#ff1f1f,#ff3131);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(255,0,0,.45);margin-bottom:18px;">
RED V2 FINDER
</div>

<div style="color:#94a3b8;font-size:20px;max-width:700px;line-height:1.8;margin-bottom:40px;">
Search any Minecraft player to view UUID, 3D skin model, cape, username history, raw profile data and more.
</div>

<div style="display:flex;gap:14px;width:100%;max-width:700px;background:rgba(17,24,39,.8);padding:14px;border-radius:24px;border:1px solid rgba(255,255,255,.06);box-shadow:0 0 30px rgba(255,0,0,.08);">
<input
id="centerSearch"
type="text"
placeholder="Search Minecraft username..."
style="flex:1;background:#0f172a;border:none;outline:none;color:white;padding:22px;border-radius:18px;font-size:18px;"
>

<button onclick="searchFromCenter()" style="width:90px;border:none;border-radius:18px;background:linear-gradient(135deg,#ff1f1f,#ff4747);color:white;font-size:28px;cursor:pointer;box-shadow:0 0 20px rgba(255,0,0,.3);">
⌕
</button>
</div>



</div>

<div id="error" class="error hidden"></div>
<div id="result"></div>
</div>

</div>

<script>
function searchFromCenter(){
fetchPlayer();
}

async function fetchPlayer(){
const username=document.getElementById('centerSearch').value.trim();
const result=document.getElementById('result');
const welcomeScreen=document.getElementById('welcomeScreen');
const error=document.getElementById('error');

welcomeScreen.style.display='none';

result.innerHTML=`
<div class="loaderWrap">
<div class="loaderContent">
<div class="loader"></div>
<div class="loadingText">LOADING PLAYER DATA...</div>
</div>
</div>
`;
error.classList.add('hidden');

if(!username){
showError('Please enter username');
return;
}

try{
const response=await fetch(`https://api.ashcon.app/mojang/v2/user/${username}`);

if(!response.ok){
throw new Error('Player not found');
}

const data=await response.json();

const uuid=data.uuid;
const skin=data.textures?.skin?.url || '';
const cape=data.textures?.cape?.url || '';
const history=data.username_history || [];

const currentUsername=data.username;

result.innerHTML=`
<div class="topCard">
<img class="avatar" src="https://mc-heads.net/avatar/${uuid}/120">

<div>
<div class="playerName">${data.username}</div>
<div style="color:#94a3b8;margin-bottom:15px;">Minecraft Premium Account</div>
<div class="badge">Mojang</div>
</div>
</div>

<div class="grid">

<div class="card">
<div class="cardTitle">3D SKIN VIEWER</div>

<div id="skin_container" style="width:100%;height:420px;border-radius:22px;overflow:hidden;background:#0b1120;"></div>

<div style="margin-top:18px;color:#94a3b8;font-size:14px;text-align:center;">
Drag mouse to rotate player model
</div>
</div>

<div class="card">
<div class="cardTitle">UUID INFORMATION</div>

<div class="infoBox">
<div class="infoTitle">UUID</div>
<div class="infoValue">${formatUUID(uuid)}</div>
</div>

<div class="infoBox">
<div class="infoTitle">UUID (No Dashes)</div>
<div class="infoValue">${uuid}</div>
</div>

<div class="infoBox">
<div class="infoTitle">Skin URL</div>
<div class="infoValue">${skin || 'No skin found'}</div>
</div>

<div class="infoBox">
<div class="infoTitle">Cape</div>
<div class="infoValue">${cape ? 'Has Cape' : 'No Cape'}</div>
</div>
</div>

<div class="card">
<div class="cardTitle">COMPLETE NAME HISTORY</div>

<div style="margin-bottom:18px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#ff1f1f,#ff4747);">
<div style="font-size:13px;opacity:.8;margin-bottom:6px;">PRESENT USERNAME</div>
<div style="font-size:24px;font-weight:800;">${currentUsername}</div>
</div>

${history.length===0?
`<div style="color:#94a3b8;">No username history found.</div>`:
history.map((item,index)=>`
<div class="historyItem">
<div>
<div style="font-weight:700;font-size:18px;">${item.username}</div>
<div style="color:#94a3b8;font-size:13px;margin-top:4px;">
${index===history.length-1?'Current Username':'Previous Username'}
</div>
</div>

<div style="text-align:right;">
<div style="color:#ff4747;font-weight:700;">#${index+1}</div>
<div style="color:#94a3b8;font-size:12px;margin-top:4px;">
${item.changed_at ? new Date(item.changed_at).toLocaleDateString() : 'Original'}
</div>
</div>
</div>
`).reverse().join('')
}

<div style="margin-top:20px;padding:18px;background:#0f172a;border-radius:18px;border:1px solid rgba(255,255,255,.05);">
<div style="color:#94a3b8;font-size:13px;margin-bottom:8px;">TOTAL USERNAMES USED</div>
<div style="font-size:42px;font-weight:800;color:#ff3131;">${history.length}</div>
</div>
</div>

<div class="card">
<div class="cardTitle">SKIN & CAPE</div>

<div style="display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;">
<img src="https://mc-heads.net/body/${uuid}/120">
${cape ? `<img src="${cape}" style="width:100px;border-radius:12px;">` : '<div style="color:#94a3b8;">No Cape</div>'}
</div>
</div>

<div class="card">
<div class="cardTitle">RAW PROFILE DATA</div>
<pre>${JSON.stringify(data,null,2)}</pre>
</div>

</div>
`;

load3DViewer(uuid,skin);

}catch(err){
showError(err.message);
}
}

function showError(msg){
const error=document.getElementById('error');
error.innerText=msg;
error.classList.remove('hidden');
}

function formatUUID(uuid){
return uuid.replace(/(.{8})(.{4})(.{4})(.{4})(.{12})/,'$1-$2-$3-$4-$5');
}



document.getElementById('centerSearch').addEventListener('keypress',function(e){
if(e.key==='Enter'){
searchFromCenter();
}
});
const skinViewerScript=document.createElement('script');
skinViewerScript.src='https://unpkg.com/skinview3d/bundles/skinview3d.bundle.js';
document.body.appendChild(skinViewerScript);

function load3DViewer(uuid,skinUrl){
setTimeout(()=>{
const container=document.getElementById('skin_container');
if(!container || !window.skinview3d)return;

container.innerHTML='';

const canvas=document.createElement('canvas');
container.appendChild(canvas);

const viewer=new skinview3d.SkinViewer({
canvas:canvas,
width:container.clientWidth,
height:420,
skin:skinUrl || `https://mc-heads.net/skin/${uuid}`
});

viewer.zoom=0.8;
viewer.fov=70;
viewer.autoRotate=true;
viewer.animation=new skinview3d.WalkingAnimation();

},600);
}

</script>

<div style="position:fixed;bottom:18px;right:25px;color:#94a3b8;font-size:14px;background:rgba(17,24,39,.75);padding:12px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.05);backdrop-filter:blur(10px);box-shadow:0 0 20px rgba(255,0,0,.08);z-index:999;">
Made by <span style="color:#ff3131;font-weight:700;">ItzEchoCraft</span> • YouTuber<br><div style="margin-top:8px;font-size:12px;line-height:1.8;">
<a href="https://www.youtube.com/@ItzEchoCraft" target="_blank" style="display:inline-flex;align-items:center;gap:8px;color:#ff4d4d;text-decoration:none;padding:8px 14px;background:rgba(255,0,0,.08);border:1px solid rgba(255,0,0,.15);border-radius:14px;box-shadow:0 0 18px rgba(255,0,0,.25);margin-right:10px;transition:.2s;">
<img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" style="width:22px;height:16px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,0,0,.7));">
<span style="font-weight:700;">YouTube</span>
</a>

<a href="https://discord.gg/Dg5HXKdrmz" target="_blank" style="display:inline-flex;align-items:center;gap:8px;color:#8ab4ff;text-decoration:none;padding:8px 14px;background:rgba(88,101,242,.08);border:1px solid rgba(88,101,242,.15);border-radius:14px;box-shadow:0 0 18px rgba(88,101,242,.25);transition:.2s;">
<img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" style="width:20px;height:20px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(88,101,242,.7));">
<span style="font-weight:700;">Discord</span>
</a>
</div>
</div>

</body>
</html>
